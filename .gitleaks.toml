# Preserve upstream rules; exempt only exact reviewed non-secret values/paths.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact public ID-01 Docker image tag, not a credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)docs/evaluation/identity/id-01-step-2/(image-publication-request\.md|builder-build-result\.md|builder-plan\.md|builder-proposal/(build|publish)\.sh\.proposed)$''']
regexes = ['''^id01-amd64-52186a0466fe$''']

[[rules.allowlists]]
description = "SHA-256 integrity fingerprints in the model and source-evidence manifests"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)apps/api/app/domains/listings/embedding_pipeline\.json$''',
  '''(^|/)docs/evaluation/domain/se-01/native-http-model/result\.json$''',
  '''(^|/)docs/evaluation/domain/se-01/public-api/result\.json$''',
  '''(^|/)docs/evaluation/domain/se-02/frontend/result\.json$''',
  '''(^|/)docs/evaluation/domain/se-02/integration-readiness/result\.json$''',
  '''(^|/)docs/evaluation/domain/se-02/wanted-response/result\.json$''',
]
regexes = ['''^\s*"(tokenizer_sha256|apps/api/app/core/auth\.py|apps/web/src/features/search/discoveryApi\.ts|apps/web/tests/discovery-api\.test\.ts|contracts/generated/openapi\.json|apps/web/src/features/search/wantedApi\.ts|apps/web/tests/wanted-api\.test\.ts)"\s*:\s*"[0-9a-f]{64}",?\s*$''']
