# This root manifest owns shared tooling and the API's future dependencies.
# The application is run from its source tree, not installed as a distribution.
[project]
name = "clip"
version = "0.1.0"
description = "Campus Listing and Item Platform"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["black==26.10.1"]

[tool.uv]
package = false

[tool.black]
required-version = "26.10.1"
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'
# Extend Black's defaults so local environments and generated contracts are
# never reformatted. Generated contracts must be rebuilt from their source.
extend-exclude = '''
/(\.venv|contracts/generated)/
'''
