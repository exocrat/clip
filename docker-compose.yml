# Local development only. Step 5 supplies the validated lifecycle wrapper.
name: clip-local

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: clip_local
      POSTGRES_USER: clip_local
      # No fallback password: Compose rejects an absent or empty value.
      POSTGRES_PASSWORD: ${CLIP_LOCAL_POSTGRES_PASSWORD:?Set CLIP_LOCAL_POSTGRES_PASSWORD for local development only}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
      PGDATA: /var/lib/postgresql/18/docker
      TZ: UTC
    command: [postgres, -c, timezone=UTC, -c, log_timezone=UTC]
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      # PostgreSQL 18 uses the versioned PGDATA beneath this mount point.
      - clip_local_postgres_data:/var/lib/postgresql
    healthcheck:
      # Readiness only; Step 6 separately verifies authenticated connectivity.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=clip_local, --dbname=clip_local]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  # Compose scopes this to clip-local_clip_local_postgres_data by default.
  clip_local_postgres_data:
